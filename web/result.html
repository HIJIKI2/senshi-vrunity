<title>穿刺VR 結果</title>
<!-- 穿刺トレーニングVR の結果ページ。QR コード（URL#結果）をスマホで読むとここが開き、# 以降の結果を装飾して表示する。
     サーバーには何も送らない（すべてこのページの JavaScript で描く）。形式は SessionRecord.QrPayload: 1 行目 "senshi1"、以降 "キー=値"（URL の ?r= に base64url で載る。古い APK の #生テキスト / #base64url も読める）。 -->
<style>
  :root { --bg:#0f1a2b; --card:#16243a; --ink:#e8eef7; --muted:#9fb3c8; --ok:#7ee8a2; --warn:#ffd166; --bad:#ff7b7b; --line:#2a3b55; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif; line-height:1.5; }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; color:var(--warn); letter-spacing:.04em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .score { display:flex; align-items:baseline; gap:10px; }
  .score b { font-size:56px; line-height:1; }
  .score .rank { font-size:22px; color:var(--warn); }
  .score .unit { color:var(--muted); }
  .meta { color:var(--muted); font-size:13px; margin-top:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { background:#1f3150; border-radius:999px; padding:4px 10px; font-size:13px; }
  .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .row .k { color:var(--muted); }
  .pen { padding:8px 0; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:flex-start; }
  .pen:last-child { border-bottom:none; }
  .pen .pts { flex:0 0 auto; min-width:44px; text-align:center; background:#3a1f28; color:var(--bad); border-radius:8px; padding:2px 6px; font-weight:bold; }
  .good { color:var(--ok); }
  .bar { height:10px; background:#0b1322; border-radius:999px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#4fc3f7,#7ee8a2); }
  .foot { color:var(--muted); font-size:12px; text-align:center; margin:16px 0 8px; }
  .logo { text-align:center; padding:4px 16px 28px; }
  .logo img { width:200px; max-width:60%; height:auto; }
  .btn { display:inline-block; margin-top:8px; padding:8px 14px; border-radius:10px; background:#2a6fb8; color:#fff; text-decoration:none; font-size:14px; border:none; }
  .err { color:var(--bad); }
  .survey { border-color:#3b7a4f; background:#15302a; }
  .survey h2 { font-size:16px; margin:0 0 6px; color:var(--ok); }
  .survey p { margin:0 0 4px; font-size:14px; }
  .survey .btn { background:#2ea85a; font-size:16px; padding:10px 18px; margin-top:10px; }
  .survey .id { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>

<script>
(function () {
  function raw() {
    var h = location.hash ? location.hash.substring(1) : "";
    var q = /[?&]r=([^&#]+)/.exec(location.search || "");
    if (q) h = q[1];                                   // v1.22 以降: ?r=<base64url>（# はリーダーに捨てられることがある）
    try { h = decodeURIComponent(h); } catch (e) { /* 生の UTF-8 のまま */ }
    if (/^[A-Za-z0-9_-]+$/.test(h) && h.indexOf("senshi1") !== 0) {
      // base64url（アプリ v1.19 以降）: QR の URL に改行や日本語を含めないための符号化
      try {
        var b64 = h.replace(/-/g, "+").replace(/_/g, "/"); while (b64.length % 4) b64 += "=";
        var bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        h = (typeof TextDecoder !== "undefined") ? new TextDecoder("utf-8").decode(bytes) : decodeURIComponent(escape(bin));
      } catch (e2) { /* 符号化されていない */ }
    }
    return h;
  }
  function parse(text) {
    var lines = text.split(/\r?\n/);
    if (lines[0] !== "senshi1") return null;
    var o = {};
    for (var i = 1; i < lines.length; i++) {
      var m = lines[i].match(/^([A-Za-z]+)=(.*)$/); if (m) o[m[1]] = m[2];
    }
    return o;
  }
  var SURVEY_URL = "https://forms.gle/1fuFZfr4v5jQ4V2Y8";   // 体験者向け詳細アンケート（Google フォーム）
  function surveyCard(id) {
    return '<div class="card survey"><h2>アンケートにご協力ください</h2>'
      + '<p>このアプリは学会発表に向けて教育効果を調べています。体験後の詳しいアンケート（5〜8 分）にご協力をお願いします。回答は匿名で集計し、個人は特定されません。</p>'
      + '<a class="btn" href="' + SURVEY_URL + '" target="_blank" rel="noopener">アンケートに回答する</a>'
      + (id ? '<div class="id">回答時に受付番号を聞かれます。わからない場合はこの ID を記入してください: <b>' + esc(id) + '</b></div>' : '')
      + '</div>';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function mmss(sec) { sec = parseInt(sec || "0", 10); return Math.floor(sec / 60) + "分" + (sec % 60) + "秒"; }
  function render(o) {
    var app = document.getElementById("app"); document.getElementById("none").remove();
    var score = parseInt(o.s || "0", 10);
    var html = "";
    html += '<div class="card"><div class="score"><b>' + score + '</b><span class="unit">点</span><span class="rank">' + esc(o.r || "") + '</span></div>';
    html += '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, score)) + '%"></i></div>';
    html += '<div class="meta">' + esc(o.d || "") + '　所要 ' + mmss(o.t) + '</div>';
    html += '<div class="chips">' + [o.v, o.n, o.p, o.m].filter(Boolean).map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join("") + '</div></div>';
    html += surveyCard(o.id);
    html += '<div class="card">';
    html += '<div class="row"><span class="k">症例</span><span>' + esc(o.c || "標準") + '</span></div>';
    html += '<div class="row"><span class="k">減点</span><span>' + esc(o.pn || "0") + ' 件　' + esc(o.pp || "0") + ' 点</span></div>';
    html += '<div class="row"><span class="k">未実施の手順</span><span>' + esc(o.om || "0") + '</span></div>';
    if (o.q) html += '<div class="row"><span class="k">アンケート</span><span style="text-align:right">' + esc(o.q) + '</span></div>';
    html += '<div class="row"><span class="k">ID</span><span>' + esc(o.id || "") + '</span></div></div>';
    var pens = (o.P || "").split(";").filter(function (x) { return x.length > 0; });
    html += '<div class="card"><b>' + (pens.length ? "減点の内容" : "") + '</b>';
    if (!pens.length) html += '<div class="good">減点はありません。手順どおりにできています。</div>';
    pens.forEach(function (p) {
      var i = p.indexOf("|"); var pts = i >= 0 ? p.substring(0, i) : "", msg = i >= 0 ? p.substring(i + 1) : p;
      html += '<div class="pen"><span class="pts">-' + esc(pts) + '</span><span>' + esc(msg) + '</span></div>';
    });
    if (parseInt(o.pn || "0", 10) > pens.length) html += '<div class="meta">ほか ' + (parseInt(o.pn, 10) - pens.length) + ' 件（指導者画面の CSV に全件あります）</div>';
    html += '</div>';
    html += '<div class="card"><div class="meta">この画面はスマホの中だけで表示しています（結果はどこにも送信されません）。スクリーンショットで保存できます。</div>'
          + '<button class="btn" onclick="navigator.share&&navigator.share({title:\'穿刺VR 結果\',text:document.body.innerText})">共有</button></div>';
    app.insertAdjacentHTML("beforeend", html);
  }
  var o = parse(raw());
  if (o) { render(o); document.title = "穿刺VR 結果 " + (o.s || "") + "点"; }
  else document.getElementById("app").insertAdjacentHTML("beforeend", surveyCard(""));
})();
